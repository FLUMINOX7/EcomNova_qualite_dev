<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)" />
  
  <!-- E letter stylized with tech aesthetic -->
  <g fill="#FFFFFF">
    <!-- Main E shape -->
    <rect x="18" y="16" width="4" height="32" rx="2"/>
    <rect x="18" y="16" width="20" height="4" rx="2"/>
    <rect x="18" y="28" width="16" height="4" rx="2"/>
    <rect x="18" y="44" width="20" height="4" rx="2"/>
    
    <!-- Tech accent dots -->
    <circle cx="42" cy="20" r="2" opacity="0.8"/>
    <circle cx="38" cy="32" r="2" opacity="0.8"/>
    <circle cx="42" cy="46" r="2" opacity="0.8"/>
  </g>
  
  <!-- Orbital ring for futuristic look -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 4"/>
</svg>
